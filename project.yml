name: Ember
options:
  bundleIdPrefix: com.gerov
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CLANG_CXX_LANGUAGE_STANDARD: c++20
    GCC_OPTIMIZATION_LEVEL[config=Release]: "3"
    MARKETING_VERSION: 1.1.0
    CURRENT_PROJECT_VERSION: 1
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # macOS: sign to run locally. iOS devices: automatic signing with this team.
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY[sdk=macosx*]: "-"
    DEVELOPMENT_TEAM[sdk=iphoneos*]: C9LBGZNZ6P

targets:
  Ember:
    type: application
    platform: [macOS, iOS]
    sources:
      - path: App
        excludes: ["*.entitlements"]
    dependencies:
      - target: EmberExtension_${platform}
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_NAME: Ember
        PRODUCT_BUNDLE_IDENTIFIER: com.gerov.ember
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Ember
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: App/App.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"

  EmberExtension:
    type: app-extension
    platform: [macOS, iOS]
    sources:
      - path: AudioUnit
      - path: Extension
        excludes: ["*.entitlements", "Info.plist"]
    settings:
      base:
        PRODUCT_NAME: EmberExtension
        PRODUCT_MODULE_NAME: EmberExtension
        PRODUCT_BUNDLE_IDENTIFIER: com.gerov.ember.audiounit
        INFOPLIST_FILE: Extension/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: AudioUnit/Bridge/EmberExtension-Bridging-Header.h
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: Extension/Extension.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
