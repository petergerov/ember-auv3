  <h1>Ember is installed</h1>
  <p>Restart your audio host if it is running. In the plugin list, look for
     <b>Gerov: Ember</b> under Audio Units → Gerov.</p>
  <p>If it doesn't appear, open <b>Ember</b> from Applications once. That forces macOS to
     register the plugin.</p>
  <p>To uninstall, drag <b>Ember.app</b> from Applications to the Trash.</p>
